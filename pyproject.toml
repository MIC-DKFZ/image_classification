[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glovita"
version = "0.1.0"
description = "GloViTa: a PyTorch training stack for global vision tasks."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENCE" }
authors = [
  { name = "Sebastian Ziegler" }
]
dependencies = [
  "torch>=2.1.0",
  "torchvision>=0.16.0",
  "numpy>=1.23.5",
  "accelerate>=0.30.0",
  "tyro>=0.8.0",
  "pydantic>=2.0.0",
  "timm>=0.9.16",
  "transformers>=4.38.0",
  "pytorchvideo>=0.1.5",
  "peft>=0.14.0",
  "torchmetrics>=1.3.0",
  "albumentations>=1.3.0",
  "pillow>=9.3.0",
  "madgrad>=1.2",
  "h5py>=3.8.0",
  "matplotlib>=3.6.2",
  "blosc2>=2.7.0",
  "scikit-learn>=1.0.0",
  "rich>=12.6.0",
  "dynamic-network-architectures @ git+https://github.com/MIC-DKFZ/dynamic-network-architectures.git",
  "batchgeneratorsv2 @ git+https://github.com/MIC-DKFZ/batchgeneratorsv2.git",
  "acvl-utils @ git+https://github.com/MIC-DKFZ/acvl_utils.git",
]

[project.optional-dependencies]
wandb = ["wandb>=0.15.8"]
mlflow = ["mlflow>=2.14.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["glovita*"]
