[pytest]
# Pytest configuration

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Minimum Python version
minversion = 3.8

# Command line options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:cacheprovider

# Markers for organizing tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    requires_data: marks tests that require actual dataset files
    unit: unit tests (fast, no external dependencies)
    integration: integration tests (may be slower)
    augmentation: augmentation policy tests
    datamodule: PyTorch Lightning DataModule tests

# Environment variables
env =
    DATA_ROOT=/home/d246a/Documents/data/SynergyUnitDatasets
