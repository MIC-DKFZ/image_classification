# @package _global_
data:
  module:
    _target_: datasets.diabetic_retina.EyePACSDataModule
    name: DiabeticRetinopathy
    data_root_dir: ${data_dir}/DiabeticRetinopathy
    batch_size: 32
    train_transforms:
      _target_: augmentation.policies.diabetic_retina.TrainTransform
    test_transforms:
      _target_: augmentation.policies.diabetic_retina.TestTransform

  num_classes: 5

model:
  task: 'Classification'
  subtask: 'multiclass'
  cifar_size: False
  input_channels: 3
  patch_size: [224, 224]
  input_shape: ${model.patch_size}

trainer:
  logger:
    project: DiabeticRetinopathy
  max_epochs: 50
