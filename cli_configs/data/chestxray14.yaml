# @package _global_
data:
  module:
    _target_: datasets.chestxray14.ChestXray14DataModule
    name: ChestXray14
    data_root_dir: ${data_dir}/ChestXray14
    batch_size: 32
    data_fraction: 0.1
    train_transforms:
      _target_: augmentation.policies.chestxray14.TrainTransform
    test_transforms:
      _target_: augmentation.policies.chestxray14.TestTransform

  num_classes: 15

model:
  task: 'Classification'
  subtask: 'multiclass'
  cifar_size: False
  input_channels: 3
  patch_size: [224, 224]
  input_shape: ${model.patch_size}

wandb:
  entity: synergy_unit
  project: ChestXray14
