# @package _global_
data:
  module:
    _target_: datasets.precomputed_features.HDF5DataModuleJointTokenAgg
    name: ILSVRC_2012
    model_type: dinov2_vits14_reg
    imgsize: 224
    precision: 16
    data_fraction: 1
    data_root_dir: ${data_dir}/precomputed_features
    batch_size: 128
    train_transforms:
      _target_: augmentation.utils.DummyTransform
    test_transforms:
      _target_: augmentation.utils.DummyTransform

  num_classes: 1000

model:
  embed_dim: ${model_embed_dim_extractor:${data.module.model_type}}
