# @package _global_
data:
  module:
    _target_: datasets.elpv.ELPVDataModule
    name: ELPV
    data_root_dir: /dkfz/cluster/gpu/data/OE0441/d246a/elpv
    batch_size: 128
    train_transforms: 
      _target_: augmentation.policies.synergy_unit_transforms.FlipRotateTransform
      image_size: 224  # 224, 448
      norm: imagenet
    test_transforms: 
      _target_: augmentation.policies.synergy_unit_transforms.TestTransform
      image_size: 224  # 224, 448
      norm: imagenet
    # expected helper files in data_root_dir:
    # - splits_final.json
    # - labels_probs.json
    # - data/labels.csv

  cv:
    k: 5

  num_classes: 2          # binary: defect (1) vs. no-defect (0)
  patch_size: [300, 300]  # ELPV images are 300x300

model:
  task: 'Classification'
  cifar_size: False
  input_shape: ${data.patch_size}