# @package _global_
data:
  module:
    _target_: datasets.imagenet.ImagenetDataModule
    name: ILSVRC_2012
    data_root_dir: ${data_dir}/ILSVRC_2012  # Or use cluster path: /dkfz/cluster/gpu/data/OE0441/s522r/ILSVRC_2012
