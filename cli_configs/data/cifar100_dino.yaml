# @package _global_
data:
  module:
    _target_: datasets.cifar.CIFAR100DataModule
    name: cifar100
    data_root_dir: ${data_dir}/cifar100
    batch_size: 128
    data_fraction: 1.0
    train_transforms:
      # _target_: augmentation.policies.cifar.RandAugmentTransform_dino
      _target_: augmentation.policies.cifar.TestTransform_dino
    test_transforms:
      _target_: augmentation.policies.cifar.TestTransform_dino

  num_classes: 100

model:
  task: 'Classification'
  cifar_size: True