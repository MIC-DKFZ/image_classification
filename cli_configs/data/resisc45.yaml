# @package _global_
data:
  module:
    _target_: datasets.resisc45.RESISC45DataModule
    name: RESISC45
    data_root_dir: ${data_dir}/RESISC45
    batch_size: 32
    train_transforms:
      _target_: augmentation.policies.resisc45.TrainTransform
    test_transforms:
      _target_: augmentation.policies.resisc45.TestTransform

  num_classes: 45

model:
  task: 'Classification'
  subtask: 'multiclass'
  cifar_size: False
  input_channels: 3
  patch_size: [224, 224]
  input_shape: ${model.patch_size}

trainer:
  logger:
    project: RESISC45
  max_epochs: 100
