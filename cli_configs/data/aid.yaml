# @package _global_
data:
  module:
    _target_: datasets.aid.AIDDataModule
    name: AID
    data_root_dir: /dkfz/cluster/gpu/data/OE0441/d246a/AID
    batch_size: 64
    train_transforms:
     _target_: augmentation.policies.synergy_unit_transforms.FlipRotateTransform
     image_size: 224  # 224, 448
     norm: imagenet
    test_transforms:
     _target_: augmentation.policies.synergy_unit_transforms.TestTransform
     image_size: 224  # 224, 448
     norm: imagenet
  cv:
    k: 5

  num_classes: 30
  patch_size: [600, 600]

model:
  task: 'Classification'
  subtask: 'multiclass'
  cifar_size: False
  input_shape: ${data.patch_size}