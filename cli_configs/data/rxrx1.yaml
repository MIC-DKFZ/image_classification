# @package _global_
data:
  module:
    _target_: datasets.rxrx1.RxRx1DataModule
    name: RxRx1
    data_root_dir: ${data_dir}/RxRx1
    batch_size: 32
    train_transforms:
      _target_: augmentation.policies.rxrx1.TrainTransform
    test_transforms:
      _target_: augmentation.policies.rxrx1.TestTransform

  num_classes: 1139

model:
  task: 'Classification'
  subtask: 'multiclass'
  cifar_size: False
  input_channels: 3
  patch_size: [224, 224]
  input_shape: ${model.patch_size}

trainer:
  logger:
    project: RxRx1
  max_epochs: 50
