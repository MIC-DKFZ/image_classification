# @package _global_
data:
  module:
    _target_: datasets.neudet.NEUDETDataModule
    name: NEUDET
    data_root_dir: ${data_dir}/NEUDET
    batch_size: 32
    data_fraction: 0.1
    train_transforms:
      _target_: augmentation.policies.neudet.TrainTransform
    test_transforms:
      _target_: augmentation.policies.neudet.TestTransform

  num_classes: 6

model:
  task: 'Classification'
  subtask: 'multiclass'
  cifar_size: False
  input_channels: 3
  patch_size: [224, 224]
  input_shape: ${model.patch_size}

wandb:
  entity: synergy_unit
  project: NEUDET