# @package _global_
data:
  module:
    _target_: datasets.fgvc_aircraft.FGVCAircraftDataModule
    name: FGVCAircraft
    data_root_dir: /home/d246a/Documents/data/SynergyUnitDatasets/FGVCAircraft
    batch_size: 32
    data_fraction: 0.1
    train_transforms:
      _target_: augmentation.policies.fgvc_aircraft.TrainTransform
