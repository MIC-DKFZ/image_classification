# @package _global_
data:
  module:
    _target_: datasets.pcam.PCamDataModule
    name: PCam
    data_root_dir: /home/d246a/Documents/data/SynergyUnitDatasets/PCam
    batch_size: 32
    data_fraction: 0.1
    train_transforms:
      _target_: augmentation.policies.pcam.TrainTransform
    test_transforms:
      _target_: augmentation.policies.pcam.TestTransform

