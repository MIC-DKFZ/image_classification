# @package _global_
peft:
  _target_: peft_models.loha.LoHa
  peft: LoHa
  loha_rank: 4                     # rank of each factor pair; effective rank up to r^2
  loha_alpha: 1.0
  loha_dropout: 0.0
  loha_rank_dropout: 0.0
  loha_target_modules: ['attn.q_proj', 'attn.k_proj', 'attn.v_proj', 'attn.proj', 'mlp.fc1_g', 'mlp.fc1_x', 'mlp.fc2']

model:
  lr: 0.0001
